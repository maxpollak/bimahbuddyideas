<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Games</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Rubik:wght@800;900&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #F7F4EA;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-image: radial-gradient(#E2DAC7 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    .font-hebrew {
      font-family: 'Rubik', sans-serif;
    }

    /* Chunky physical neo-brutalist buttons */
    .fun-square-btn {
      text-decoration: none;
      outline: none;
      position: relative;
      border: 4px solid #18181B;
      box-shadow: 7px 7px 0px #18181B;
      transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fun-square-btn:hover {
      transform: translate(-3px, -3px);
      box-shadow: 10px 10px 0px #18181B;
    }
    .fun-square-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0px #18181B;
    }

    /* Back Button */
    .back-pill-btn {
      text-decoration: none;
      outline: none;
      border: 3px solid #18181B;
      box-shadow: 4px 4px 0px #18181B;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .back-pill-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #18181B;
    }
    .back-pill-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #18181B;
    }

    /* Distinct punchy button colors */
    .btn-match { background-color: #FFC72C; }    /* Golden Honey */
    .btn-runner { background-color: #38BDF8; }   /* Electric Sky */
    .btn-slicer { background-color: #FB7185; }   /* Bold Rose */
    .btn-catcher { background-color: #34D399; }  /* Mint Emerald */
  </style>
</head>
<body class="min-h-screen w-full flex flex-col justify-between p-6 sm:p-10">

  <header class="w-full max-w-5xl mx-auto flex items-center justify-start">
    <a href="index.html" 
       class="back-pill-btn px-5 py-2.5 rounded-2xl bg-white text-zinc-950 font-black text-sm sm:text-base flex items-center gap-2 cursor-pointer">
      <span class="text-lg leading-none">&larr;</span>
      <span>Back to Hub</span>
    </a>
  </header>

  <main class="w-full flex-1 flex items-center justify-center my-6">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 sm:gap-8 max-w-5xl justify-items-center">
      
      <a href="letter_match.html" 
         class="fun-square-btn btn-match w-48 h-48 sm:w-56 sm:h-56 aspect-square rounded-[2rem] flex flex-col items-center justify-center p-6 text-center cursor-pointer overflow-hidden">
        <span class="absolute -bottom-4 -right-2 font-hebrew text-8xl sm:text-9xl font-black text-black/10 leading-none pointer-events-none">
          א
        </span>
        <span class="relative z-10 text-xl sm:text-2xl font-black text-zinc-950 tracking-tight leading-tight">
          Alef-Bet<br>Match
        </span>
      </a>

      <a href="letter_runner.html" 
         class="fun-square-btn btn-runner w-48 h-48 sm:w-56 sm:h-56 aspect-square rounded-[2rem] flex flex-col items-center justify-center p-6 text-center cursor-pointer overflow-hidden">
        <span class="absolute -bottom-4 -right-2 font-hebrew text-8xl sm:text-9xl font-black text-black/10 leading-none pointer-events-none">
          ב
        </span>
        <span class="relative z-10 text-xl sm:text-2xl font-black text-zinc-950 tracking-tight leading-tight">
          Alef-Bet<br>Runner
        </span>
      </a>

      <a href="letter_slicer.html" 
         class="fun-square-btn btn-slicer w-48 h-48 sm:w-56 sm:h-56 aspect-square rounded-[2rem] flex flex-col items-center justify-center p-6 text-center cursor-pointer overflow-hidden">
        <span class="absolute -bottom-4 -right-2 font-hebrew text-8xl sm:text-9xl font-black text-black/10 leading-none pointer-events-none">
          ג
        </span>
        <span class="relative z-10 text-xl sm:text-2xl font-black text-zinc-950 tracking-tight leading-tight">
          Alef-Bet<br>Slicer
        </span>
      </a>

      <a href="letter_catcher.html" 
         class="fun-square-btn btn-catcher w-48 h-48 sm:w-56 sm:h-56 aspect-square rounded-[2rem] flex flex-col items-center justify-center p-6 text-center cursor-pointer overflow-hidden">
        <span class="absolute -bottom-4 -right-2 font-hebrew text-8xl sm:text-9xl font-black text-black/10 leading-none pointer-events-none">
          ד
        </span>
        <span class="relative z-10 text-xl sm:text-2xl font-black text-zinc-950 tracking-tight leading-tight">
          Alef-Bet<br>Catcher
        </span>
      </a>

    </div>
  </main>

  <div class="h-10 invisible"></div>

</body>
</html>
