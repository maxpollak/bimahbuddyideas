<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hebrew Games</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&family=Rubik:wght@800;900&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #F7F4EA;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      background-image: 
        radial-gradient(#E2DAC7 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    .font-hebrew {
      font-family: 'Rubik', sans-serif;
    }

    /* Chunky physical neo-brutalist buttons */
    .fun-square-btn {
      text-decoration: none;
      outline: none;
      position: relative;
      transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Button 1: Warm Golden Honey */
    .btn-letters {
      background-color: #FFC72C;
      border: 4px solid #18181B;
      box-shadow: 7px 7px 0px #18181B;
    }
    .btn-letters:hover {
      transform: translate(-3px, -3px);
      box-shadow: 10px 10px 0px #18181B;
    }
    .btn-letters:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0px #18181B;
    }

    /* Button 2: Vivid Punch Coral */
    .btn-vowels {
      background-color: #FF6B4A;
      border: 4px solid #18181B;
      box-shadow: 7px 7px 0px #18181B;
    }
    .btn-vowels:hover {
      transform: translate(-3px, -3px);
      box-shadow: 10px 10px 0px #18181B;
    }
    .btn-vowels:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0px #18181B;
    }

    /* Button 3: Vibrant Mint Green */
    .btn-vocab {
      background-color: #34D399;
      border: 4px solid #18181B;
      box-shadow: 7px 7px 0px #18181B;
    }
    .btn-vocab:hover {
      transform: translate(-3px, -3px);
      box-shadow: 10px 10px 0px #18181B;
    }
    .btn-vocab:active {
      transform: translate(4px, 4px);
      box-shadow: 2px 2px 0px #18181B;
    }
  </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-6">

  <main class="w-full flex items-center justify-center">
    
    <div class="flex flex-col sm:flex-row items-center justify-center gap-6 sm:gap-8 flex-wrap">
      
      <a href="letters.html" 
         class="fun-square-btn btn-letters w-56 h-56 sm:w-60 sm:h-60 aspect-square rounded-[2rem] flex flex-col items-center justify-center p-6 text-center cursor-pointer overflow-hidden">
        <span class="absolute -bottom-4 -right-2 font-hebrew text-8xl sm:text-9xl font-black text-black/10 leading-none pointer-events-none">
          א
        </span>
        <span class="relative z-10 text-2xl sm:text-3xl font-black text-zinc-950 tracking-tight leading-tight">
          Letter Games
        </span>
      </a>

      <a href="vowels.html" 
         class="fun-square-btn btn-vowels w-56 h-56 sm:w-60 sm:h-60 aspect-square rounded-[2rem] flex flex-col items-center justify-center p-6 text-center cursor-pointer overflow-hidden">
        <span class="absolute -bottom-4 -right-2 font-hebrew text-8xl sm:text-9xl font-black text-black/10 leading-none pointer-events-none">
          ב
        </span>
        <span class="relative z-10 text-2xl sm:text-3xl font-black text-white tracking-tight leading-tight">
          Vowel Games
        </span>
      </a>

      <a href="vocab.html" 
         class="fun-square-btn btn-vocab w-56 h-56 sm:w-60 sm:h-60 aspect-square rounded-[2rem] flex flex-col items-center justify-center p-6 text-center cursor-pointer overflow-hidden">
        <span class="absolute -bottom-4 -right-2 font-hebrew text-8xl sm:text-9xl font-black text-black/10 leading-none pointer-events-none">
          ג
        </span>
        <span class="relative z-10 text-2xl sm:text-3xl font-black text-zinc-950 tracking-tight leading-tight">
          Vocab Words
        </span>
      </a>

    </div>

  </main>

</body>
</html>
